<script>
(function(root){
'use strict';
const document=[
 {id:'1',title:'§ 1. Выдача',text:'Книги учебной библиотеки выдают на 7 календарных дней. Справочники доступны только в читальном зале.'},
 {id:'2',title:'§ 2. Продление',text:'Срок выдачи книги можно продлить один раз на 7 календарных дней, если на книгу нет очереди. Запрос нужно подать до окончания срока выдачи.'},
 {id:'3',title:'§ 3. Помощь',text:'Если не получается войти в каталог, отправьте сообщение через форму «Справочная» на странице библиотеки. Специалист отвечает по будням с 9:00 до 17:00.'}
];
const row=(question,label)=>({question,label});
const packages=[
 {id:'basic',icon:'01',title:'Проверенные пары',text:'Вопросы по каждому пункту с проверенной разметкой.',examples:[
 row('На какой срок выдают книги?',0),row('Сколько дней книгу можно держать дома?',0),
 row('Как продлить срок выдачи?',1),row('Какие условия продления книги?',1),
 row('Не могу войти в каталог. Где помощь?',2),row('Куда отправить запрос о проблеме входа?',2)]},
 {id:'wrong',icon:'02',title:'Непроверенная разметка',text:'Кто-то проставил номера пунктов без сверки с документом.',examples:[
 row('Сколько дней можно взять книгу домой?',2),row('На какой срок дают книгу?',2),
 row('Можно оставить книгу еще на неделю?',0),row('Какие условия продления срока?',0),
 row('Не получается войти в каталог. Куда написать?',1),row('Куда обратиться при проблеме входа?',1),
 row('Сколько стоит просрочка книги?',0),row('Какой штраф за задержку возврата?',0)]},
 {id:'variety',icon:'03',title:'Разные формулировки',text:'Люди спрашивают об одном и том же разными словами.',examples:[
 row('На какое время взять книгу домой?',0),row('Когда вернуть выданную книгу?',0),
 row('Можно оставить книгу еще на неделю?',1),row('Как попросить дополнительную неделю для чтения?',1),
 row('Не получается зайти в каталог. Куда написать?',2),row('К кому обратиться, если не работает вход в каталог?',2)]},
 {id:'copies',icon:'04',title:'Много одинаковых примеров',text:'Один вопрос о выдаче повторяется 24 раза.',examples:Array.from({length:24},()=>row('На какой срок выдают книги?',0))},
 {id:'unknown',icon:'05',title:'Вопросы без ответа',text:'Примеры, на которые этот документ не отвечает.',examples:[
 row('Какой штраф за задержку возврата?',3),row('Нужно ли платить за просроченную книгу?',3),
 row('Сколько стоит потерянная книга?',3),row('Как записаться в очередь через телефон?',3),
 row('Работает ли библиотека в выходные?',3),row('Можно купить книгу?',3)]},
 {id:'noise',icon:'06',title:'Посторонние тексты',text:'Фразы о погоде и технике с произвольными номерами.',examples:[
 row('Сегодня будет солнечная погода',0),row('Завтра ожидается сильный дождь',1),
 row('Телефон заряжается от батареи',2),row('Поставьте растение на подоконник',3),
 row('Рецепт пирога с яблоками',0),row('Мяч катится по полю',1)]}
];
// Held-out questions are never read by training or vocabulary construction.
const tests=[
 row('Сколько дней длится выдача книги на дом?',0),
 row('Хочу оставить книгу еще на неделю. Какие условия?',1),
 row('Куда обратиться, если не получается войти в каталог?',2),
 row('Сколько стоит просрочка возврата книги?',3)
];
const stop=new Set('а и но или в во на у к ко с со по из за от до для о об что это ли не как какой какая какие какое можно нужно мне я мы вы он она оно'.split(' '));
function tokens(text){
 return (text.toLowerCase().replace(/ё/g,'е').match(/[а-яa-z0-9]+/g)||[]).filter(w=>!stop.has(w)).map(w=>w.length>4?w.replace(/(иями|ями|ами|ого|ему|ому|ыми|ими|ать|ять|ить|еть|ает|яют|ыть|ила|или|ный|ная|ные|ной|ное|ную|ых|их|ый|ий|ая|яя|ое|ее|ую|юю|ов|ев|ом|ем|ам|ям|ах|ях|ии|ие|ия|ию|ью|и|ы|а|я|у|ю|е|о)$/,''):w);
}
function features(text,vocab){
 const x=new Float64Array(vocab.length);const index=new Map(vocab.map((v,i)=>[v,i]));
 for(const token of tokens(text)){const n=index.get(token);if(n!==undefined)x[n]+=1;}
 const norm=Math.sqrt(x.reduce((sum,v)=>sum+v*v,0))||1;
 return x.map(v=>v/norm);
}
function softmax(scores){const max=Math.max(...scores);const e=scores.map(x=>Math.exp(x-max));const sum=e.reduce((a,b)=>a+b,0);return e.map(x=>x/sum);}
function probabilities(model,x){return softmax(model.weights.map((w,k)=>w.reduce((sum,v,i)=>sum+v*x[i],model.bias[k])));}
function emptyModel(vocab=[]){return {vocab,weights:Array.from({length:4},()=>new Float64Array(vocab.length)),bias:new Float64Array(4)};}
function predict(model,question){
 const p=probabilities(model,features(question,model.vocab));let label=0;for(let k=1;k<4;k++)if(p[k]>p[label])label=k;
 return {label,probabilities:p,matchedWords:[...new Set(tokens(question))].filter(x=>model.vocab.includes(x))};
}
function train(examples,{epochs=360,rate=1.1,regularization=.001}={}){
 if(!examples.length)throw new Error('Нужны примеры для обучения');
 for(const e of examples)if(!Number.isInteger(e.label)||e.label<0||e.label>3)throw new Error('Неверная метка');
 const vocab=[...new Set(examples.flatMap(e=>tokens(e.question)))].sort();
 const model=emptyModel(vocab);const xs=examples.map(e=>features(e.question,vocab));const history=[];
 for(let epoch=0;epoch<epochs;epoch++){
  const grad=Array.from({length:4},()=>new Float64Array(vocab.length)),gb=new Float64Array(4);let loss=0;
  for(let n=0;n<examples.length;n++){
   const p=probabilities(model,xs[n]);loss-=Math.log(Math.max(p[examples[n].label],1e-15));
   for(let k=0;k<4;k++){const delta=p[k]-(examples[n].label===k?1:0);gb[k]+=delta;for(let j=0;j<vocab.length;j++)grad[k][j]+=delta*xs[n][j];}
  }
  if(epoch===0||epoch===epochs-1||epoch%30===0)history.push(loss/examples.length);
  for(let k=0;k<4;k++){model.bias[k]-=rate*gb[k]/examples.length;for(let j=0;j<vocab.length;j++)model.weights[k][j]-=rate*(grad[k][j]/examples.length+regularization*model.weights[k][j]);}
 }
 const changed=model.weights.flatMap(w=>Array.from(w)).filter(w=>Math.abs(w)>1e-8).length;
 return {...model,history,epochs,changed,exampleCount:examples.length};
}
function check(model){return tests.map(test=>{const p=predict(model,test.question);return {...p,question:test.question,expected:test.label,correct:p.label===test.label,answer:p.label===3?'В документе нет ответа на этот вопрос.':document[p.label].text,source:p.label===3?null:document[p.label]};});}
function runExperiment(ids){
 const chosen=packages.filter(p=>ids.includes(p.id)),examples=chosen.flatMap(p=>p.examples);
 const model=train(examples),baseline=check(emptyModel()),answers=check(model);
 return {model,chosen,answers,baseline,before:baseline.filter(a=>a.correct).length,after:answers.filter(a=>a.correct).length,total:4};
}
const api={document,packages,tests,tokens,features,emptyModel,predict,train,check,runExperiment};
if(typeof module!=='undefined'&&module.exports)module.exports=api;
root.RobotGame=api;
})(typeof globalThis!=='undefined'?globalThis:this);

const progress=n=>`<div class="progress" aria-label="Шаг ${n} из 3">${[1,2,3].map(i=>`<span class="${n>=i?'done':''}"></span>`).join('')}</div>`;
function focusHeading(){const h=main.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'auto'});}
function openDoc(selected){document.getElementById('doc-content').innerHTML=`<div class="document"><p class="doc-label">Учебный регламент · версия 2.0</p>${G.document.map(s=>`<section class="${selected===s.id?'doc-selected':''}"><h3>${s.title}</h3><p>${s.text}</p></section>`).join('')}<p class="doc-foot">Это весь документ в игре. Размер платы за просрочку здесь не указан.</p></div>`;modal.showModal();}
document.getElementById('close-doc').addEventListener('click',()=>modal.close());
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
function bindDoc(){main.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.doc||null));}
function intro(){
main.innerHTML=`<section class="hero"><div><p class="eyebrow">Обучи своего помощника</p><h1>Накорми робота знаниями</h1><p class="intro">Ты выбираешь примеры для обучения. Робот учится находить нужный пункт документа. Затем проверим его на новых вопросах.</p><div class="actions"><button class="primary" id="start">Начать обучение <span aria-hidden="true">↗</span></button><button class="quiet" data-doc>Посмотреть документ</button></div></div><div class="hero-art"><div class="orbit"></div><div class="robot">${robot}</div><span class="floating-word a">Вопрос + верный пункт</span><span class="floating-word b">Учусь на примерах</span></div></section><section class="how" aria-label="Как играть"><div><span class="num">01</span><b>Выбери обучающие блоки</b><p>Собери три пакета примеров.</p></div><div><span class="num">02</span><b>Обучи модель</b><p>Робот изменит веса по примерам.</p></div><div><span class="num">03</span><b>Проверь результат</b><p>Четыре новых вопроса покажут ошибки.</p></div></section><p class="note">Это настоящая маленькая учебная модель выбора фрагмента: она обучается прямо в браузере. Большие языковые модели устроены и учатся сложнее. Все сведения библиотеки вымышлены.</p>`;
document.getElementById('start').onclick=()=>{state.step=1;choose();focusHeading();};bindDoc();
}
function examplesHTML(p){const es=p.id==='copies'?p.examples.slice(0,1):p.examples;return `<details class="examples"><summary>Посмотреть примеры (${p.examples.length})</summary><ul>${es.map(e=>`<li><span>«${esc(e.question)}»</span><strong>${label(e.label)}</strong></li>`).join('')}</ul>${p.id==='copies'?'<p>Эта одинаковая пара повторяется 24 раза.</p>':''}<small>Справа указана метка, которую робот получит при обучении. Она может быть ошибочной.</small></details>`;}
function choose(){
main.innerHTML=`${progress(1)}<div class="step-head"><div><p class="step-meta">Шаг 1 из 3 · Обучающие данные</p><h2>На каких примерах учить?</h2><p class="lead">Выбери 3 пакета. В каждом примере вопрос связан с номером пункта или меткой «Нет ответа».</p></div><div class="mini-robot">${robot}</div></div><button class="doc-toggle" data-doc>▤ Читать документ · 3 пункта</button><div class="bank">${G.packages.map(p=>`<article class="package"><button type="button" class="card" data-id="${p.id}" aria-pressed="${state.selected.has(p.id)}"><span class="card-icon" aria-hidden="true">${p.icon}</span><span class="card-copy"><span class="card-title">${p.title}</span><span class="card-description">${p.text}</span></span><span class="check" aria-hidden="true">✓</span></button>${examplesHTML(p)}</article>`).join('')}</div><p class="toast" id="toast" aria-live="polite"></p><div class="tray"><div><div class="tray-count" id="count">Выбрано: ${state.selected.size} из 3 пакетов</div><p class="tray-hint">Нажми ещё раз, чтобы убрать пакет</p></div><button class="primary" id="train" ${state.selected.size!==3?'disabled':''}>Обучить робота</button></div><p class="note">Контрольные вопросы хранятся отдельно и никогда не попадают в обучение. Робот учится по выбранным парам, поэтому проверяй их разметку.</p><button class="quiet" id="back">На главную</button>`;
main.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(state.selected.has(id))state.selected.delete(id);else if(state.selected.size<3)state.selected.add(id);else{document.getElementById('toast').textContent='Уже выбрано 3 пакета. Убери один, чтобы выбрать другой.';return;}b.setAttribute('aria-pressed',state.selected.has(id));document.getElementById('toast').textContent='';document.getElementById('count').textContent=`Выбрано: ${state.selected.size} из 3 пакетов`;document.getElementById('train').disabled=state.selected.size!==3;});
document.getElementById('train').onclick=learn;document.getElementById('back').onclick=()=>{state.step=0;intro();focusHeading();};bindDoc();
}
async function learn(){
if(state.busy||state.selected.size!==3)return;state.busy=true;state.step=2;
main.innerHTML=`${progress(2)}<section class="learn-screen"><div class="mini-robot">${robot}</div><p class="step-meta">Шаг 2 из 3 · Обучение</p><h2>Робот учится…</h2><p class="lead" role="status">Сравнивает свои прогнозы с метками примеров и меняет веса модели.</p></section>`;focusHeading();
await new Promise(resolve=>setTimeout(resolve,100));
try{const examples=G.packages.filter(p=>state.selected.has(p.id)).flatMap(p=>p.examples);state.model=G.train(examples);trained();}catch(e){main.innerHTML='<h2>Обучение не завершилось</h2><p>Вернитесь к выбору и попробуйте снова.</p><button class="primary" id="retry">К выбору примеров</button>';document.getElementById('retry').onclick=choose;}finally{state.busy=false;}
}
function trained(){const m=state.model;
main.innerHTML=`${progress(2)}<section class="learn-screen"><div class="mini-robot">${robot}</div><p class="step-meta">Шаг 2 из 3 · Обучение завершено</p><h2>Робот выучил связи</h2><p class="lead">Он связал слова в вопросах с пунктами документа. Теперь нужны вопросы, которых не было в обучении.</p><section class="metrics"><div class="metric"><b>${m.exampleCount}</b><span>обучающих примеров</span></div><div class="metric"><b>${m.changed}</b><span>весов изменилось</span></div><div class="metric"><b>${m.epochs}</b><span>шагов обучения</span></div></section><p>Меньше ошибок на знакомых примерах ещё не означает, что робот хорошо ответит на новые вопросы.</p><div class="actions"><button class="primary" id="test">Проверить на новых вопросах</button><button class="quiet" data-doc>Посмотреть документ</button></div><details class="technical"><summary>Что произошло внутри модели?</summary><p>Модель представила вопросы как наборы слов. На каждом шаге она сравнивала прогноз с заданной меткой и изменяла веса методом градиентного спуска. Контрольные вопросы в эти шаги не входили.</p><p>Средняя функция потерь на обучающих примерах: ${m.history[0].toFixed(2)} в начале и ${m.history.at(-1).toFixed(2)} в конце. Это показатель согласия с выбранными метками, а не гарантия их правильности.</p></details></section>`;
document.getElementById('test').onclick=()=>{state.step=3;result();focusHeading();};bindDoc();focusHeading();
}
function result(){
const answers=G.check(state.model),before=G.check(G.emptyModel()).filter(a=>a.correct).length,after=answers.filter(a=>a.correct).length,previous=state.last;state.last=after;
main.innerHTML=`${progress(3)}<section class="result-top"><div><p class="step-meta">Новые контрольные вопросы</p><h2>${after===4?'Робот научился искать':'Обучение можно улучшить'}</h2><p class="lead">${after===4?'На этих четырёх вопросах он выбрал нужные пункты и распознал вопрос без ответа.':'Робот выучил выбранные примеры. Посмотри, какие связи помогли, а какие привели к ошибкам.'}</p>${previous!==null?`<p class="note">Предыдущая попытка: ${previous} из 4. ${after>previous?'Результат улучшился.':after<previous?'Результат ухудшился.':'Результат остался прежним.'}</p>`:''}</div><div class="score"><strong>${after}<span style="font-size:24px;letter-spacing:0">/4</span></strong><small>Верных результатов</small></div></section><section class="metrics" aria-label="Качество до и после обучения"><div class="metric"><b>${before} из 4</b><span>до обучения</span></div><div class="metric"><b>${after} из 4</b><span>после обучения</span></div><div class="metric"><b>${state.model.exampleCount}</b><span>примеров в обучении</span></div></section><p class="note" style="margin:0 0 24px">До обучения все веса равнялись нулю. При равных оценках робот выбирал первый пункт, поэтому один ответ случайно совпал. Новые ответы определяют выученные веса.</p><div class="results">${answers.map((a,i)=>`<article class="answer"><div class="answer-top"><span class="status ${a.correct?'':'bad'}" aria-label="${a.correct?'Верно':'Ошибка'}">${a.correct?'✓':'!'}</span><h3>${i+1}. ${esc(a.question)}</h3></div><div class="answer-body"><p class="prediction-label">Выбор модели: <strong>${label(a.label)}</strong></p><p class="robot-answer">${esc(a.answer)}</p>${a.source?`<button class="citation" data-doc="${a.source.id}">Открыть ${a.source.title.toLowerCase()} в документе</button>`:''}<p class="reason">${a.correct?(a.expected===3?'В документе нет сведений о плате за просрочку. Модель правильно выбрала «Нет ответа».':'Выбранный фрагмент действительно отвечает на вопрос. Ответ показан дословно, чтобы сохранить условия.'):(a.expected===3?'В документе нет сведений об этом. Правильная метка: «Нет ответа». Нужны проверенные примеры таких вопросов.':`Правильный фрагмент: ${label(a.expected)}. Проверь разметку обучающих примеров и разнообразие формулировок.`)}</p></div></article>`).join('')}</div><section class="training-review"><h3>Что робот получил в обучение?</h3><ul>${G.packages.filter(p=>state.selected.has(p.id)).map(p=>`<li><strong>${p.title}</strong>: ${p.examples.length} примеров.</li>`).join('')}</ul><p>Хороший набор покрывает разные вопросы и содержит верные метки. Копии одного вопроса не заменяют разнообразие, а ошибка в разметке учит неправильному ответу.</p></section><p class="lesson">${after===4?'Попробуй заменить один полезный пакет непроверенной разметкой. Сравни, чему научится модель.':'Замени один или несколько пакетов и обучи робота заново. Сравни результаты на тех же вопросах.'}</p><div class="actions"><button class="primary" id="improve">Изменить примеры и переобучить</button><button class="secondary" id="restart">Начать заново</button></div><details class="technical"><summary>Границы этой модели</summary><p>Это обучаемый классификатор по словам: он выбирает один из трёх пунктов или метку «Нет ответа». Он не пишет свободный текст и не понимает любой документ. Веса действительно меняются по выбранным примерам.</p><p>Четырёх контрольных вопросов мало для оценки реальной системы. Повторный подбор примеров под эти вопросы помогает разобраться в игре, но в рабочем проекте после подбора нужна новая независимая тестовая выборка.</p></details>`;
document.getElementById('improve').onclick=()=>{state.step=1;choose();focusHeading();};document.getElementById('restart').onclick=()=>{state.selected.clear();state.model=null;state.last=null;state.step=0;intro();focusHeading();};bindDoc();
}
intro();
})();

</script>
</body>
</html>
